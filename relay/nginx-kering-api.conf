# Ask Kering's Claude relay. Include this inside the server { } block that serves /bali/, e.g.
#     include snippets/kering-api.conf;
# then: sudo nginx -t && sudo systemctl reload nginx
location /bali/kering/api/ {
    limit_except GET POST OPTIONS { deny all; }
    client_max_body_size 400k;
    proxy_pass http://127.0.0.1:8787/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 180s;
    proxy_buffering off;   # Ask Kering's agent answers stream line by line
    add_header Cache-Control "no-store" always;
}

# This year's rain for Ask Kering's recent_rain tool, written weekly by kering-rain.timer (agents/vps).
location = /bali/kering/rain-recent.json {
    alias /srv/kering-public/rain-recent.json;
    default_type application/json;
    add_header Cache-Control "no-cache" always;
}
